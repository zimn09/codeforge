name: Build EXE pro Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Stažení kódu z repozitáře
      uses: actions/checkout@v4

    - name: Nastavení Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalace závislostí
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Kompilace skriptu na EXE
      run: |
        pyinstaller --onefile --add-data ".;." run.py

    - name: Uložení hotového EXE jako artefakt
      uses: actions/upload-artifact@v4
      with:
        name: MujProgram-Windows
        path: dist/run.exe
